<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The two sums of squares in Row 5 of the LINEST output</title>
  <desc id="d">Two panels show the same five made-up data points and best-fit line. Left: blue squares drawn between the best-fit line and the mean of I at each data point's V; their total area is the regression sum of squares. Right: red squares drawn between each data point and the best-fit line; their total area is the residual sum of squares.</desc>
  <rect width="760" height="336" fill="#ffffff"/>
  <g transform="translate(0,0)">
  <rect x="30" y="13" width="13" height="13" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.4"/>
  <text x="51" y="25" font-size="15" font-weight="600" fill="#222222">Regression sum of squares</text>
  <text x="51" y="43" font-size="12.5" fill="#5c5c5c">LINEST Row 5, left column</text>
  <polyline points="30,62 30,282 366,282" fill="none" stroke="#8c8c8c" stroke-width="1"/>
  <text x="21" y="73" font-size="14" font-style="italic" text-anchor="end" fill="#222222">I</text>
  <text x="366" y="299" font-size="14" font-style="italic" text-anchor="end" fill="#222222">V</text>
  <rect x="37.6" y="163.0" width="68.4" height="68.4" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.4"/>
  <rect x="117.8" y="163.0" width="34.2" height="34.2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.4"/>
  <rect x="244.0" y="128.8" width="34.2" height="34.2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.4"/>
  <rect x="290.0" y="94.6" width="68.4" height="68.4" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.4"/>
  <line x1="35" y1="163.0" x2="361" y2="163.0" stroke="#5c5c5c" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="38" y="156.0" font-size="12.5" fill="#5c5c5c">mean of <tspan font-style="italic">I</tspan></text>
  <line x1="46.0" y1="276.0" x2="325.8" y2="68.0" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
  <text x="303.8" y="77.0" font-size="12.5" text-anchor="end" fill="#5c5c5c">best-fit line</text>
  <circle cx="106.0" cy="249.4" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="152.0" cy="166.6" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="198.0" cy="186.4" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="244.0" cy="101.8" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="290.0" cy="110.8" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <text x="30" y="322" font-size="12.5" fill="#5c5c5c">Side of each square: distance from the line to the mean</text>
  </g>
  <g transform="translate(380,0)">
  <rect x="30" y="13" width="13" height="13" fill="#e34948" fill-opacity="0.2" stroke="#e34948" stroke-width="1.4"/>
  <text x="51" y="25" font-size="15" font-weight="600" fill="#222222">Residual sum of squares</text>
  <text x="51" y="43" font-size="12.5" fill="#5c5c5c">LINEST Row 5, right column</text>
  <polyline points="30,62 30,282 366,282" fill="none" stroke="#8c8c8c" stroke-width="1"/>
  <text x="21" y="73" font-size="14" font-style="italic" text-anchor="end" fill="#222222">I</text>
  <text x="366" y="299" font-size="14" font-style="italic" text-anchor="end" fill="#222222">V</text>
  <rect x="106.0" y="231.4" width="18.0" height="18.0" fill="#e34948" fill-opacity="0.2" stroke="#e34948" stroke-width="1.4"/>
  <rect x="121.4" y="166.6" width="30.6" height="30.6" fill="#e34948" fill-opacity="0.2" stroke="#e34948" stroke-width="1.4"/>
  <rect x="198.0" y="163.0" width="23.4" height="23.4" fill="#e34948" fill-opacity="0.2" stroke="#e34948" stroke-width="1.4"/>
  <rect x="217.0" y="101.8" width="27.0" height="27.0" fill="#e34948" fill-opacity="0.2" stroke="#e34948" stroke-width="1.4"/>
  <rect x="290.0" y="94.6" width="16.2" height="16.2" fill="#e34948" fill-opacity="0.2" stroke="#e34948" stroke-width="1.4"/>
  <line x1="46.0" y1="276.0" x2="325.8" y2="68.0" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
  <text x="303.8" y="77.0" font-size="12.5" text-anchor="end" fill="#5c5c5c">best-fit line</text>
  <circle cx="106.0" cy="249.4" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="152.0" cy="166.6" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="198.0" cy="186.4" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="244.0" cy="101.8" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="290.0" cy="110.8" r="4.6" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <text x="30" y="322" font-size="12.5" fill="#5c5c5c">Side of each square: distance from a data point to the line</text>
  </g>
</svg>
