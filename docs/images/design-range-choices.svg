  <title id="t">Three ways to choose the values of the independent variable</title>
  <desc id="d">Three panels with the same gently curving true behavior. Left: five points crowded into a narrow range, through which lines with very different slopes all fit. Middle: points only at the two ends, which a straight line fits even though the true behavior curves. Right: points spread over a wide range with extra points where the trend bends, which reveals the curve.</desc>
