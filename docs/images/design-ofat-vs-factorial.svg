<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One variable at a time versus a 2 by 2 factorial design</title>
  <desc id="d">Left: in the plane of factor A versus factor B, a one-at-a-time design starts at low A, low B and changes each factor separately, while a factorial design also measures the corner where both are high. Right: response versus factor A for B low and B high; the lines are not parallel, so the response with both factors high is larger than the one-at-a-time prediction.</desc>
  <rect width="760" height="356" fill="#ffffff"/>
  <text x="30" y="24" font-size="15" font-weight="600" fill="#222222">Where each design takes data</text>
  <rect x="70" y="70" width="190" height="190" fill="none" stroke="#8c8c8c" stroke-width="1"/>
  <text x="104.2" y="278" font-size="12.5" text-anchor="middle" fill="#5c5c5c">low</text>
  <text x="225.8" y="278" font-size="12.5" text-anchor="middle" fill="#5c5c5c">high</text>
  <text x="62" y="229.8" font-size="12.5" text-anchor="end" fill="#5c5c5c">low</text>
  <text x="62" y="108.2" font-size="12.5" text-anchor="end" fill="#5c5c5c">high</text>
  <text x="165.0" y="298" font-size="13" text-anchor="middle" fill="#222222">factor A</text>
  <text x="24" y="165.0" font-size="13" text-anchor="middle" fill="#222222" transform="rotate(-90 24 165.0)">factor B</text>
  <line x1="116.2" y1="225.8" x2="212.8" y2="225.8" stroke="#1f1f1f" stroke-width="1.6"/>
  <polygon points="219.8,225.8 212.8,230.3 212.8,221.3" fill="#1f1f1f"/>
  <line x1="104.2" y1="213.8" x2="104.2" y2="117.2" stroke="#1f1f1f" stroke-width="1.6"/>
  <polygon points="104.2,110.2 108.7,117.2 99.7,117.2" fill="#1f1f1f"/>
  <circle cx="104.2" cy="225.8" r="7" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="225.8" cy="225.8" r="7" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="104.2" cy="104.2" r="7" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="225.8" cy="104.2" r="7" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="116.2" y="215.8" font-size="12" fill="#5c5c5c">start</text>
  <circle cx="38" cy="320" r="6" fill="#1f1f1f"/>
  <text x="50" y="324" font-size="12.5" fill="#222222">one at a time (and factorial)</text>
  <circle cx="38" cy="340" r="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="50" y="344" font-size="12.5" fill="#222222">factorial only: both changed together</text>
  <text x="400" y="24" font-size="15" font-weight="600" fill="#222222">An interaction</text>
  <polyline points="440,70 440,260 710,260" fill="none" stroke="#8c8c8c" stroke-width="1"/>
  <text x="710" y="277" font-size="13" text-anchor="end" fill="#222222"></text>
  <text x="432" y="80" font-size="13" text-anchor="end" fill="#222222">response</text>
  <text x="480" y="278" font-size="12.5" text-anchor="middle" fill="#5c5c5c">A low</text>
  <text x="670" y="278" font-size="12.5" text-anchor="middle" fill="#5c5c5c">A high</text>
  <text x="575.0" y="298" font-size="13" text-anchor="middle" fill="#222222">factor A</text>
  <line x1="480" y1="230" x2="670" y2="168" stroke="#2a78d6" stroke-width="2.2"/>
  <line x1="480" y1="198" x2="670" y2="92" stroke="#e34948" stroke-width="2.2"/>
  <line x1="480" y1="198" x2="670" y2="136.0" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="480" cy="230" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="670" cy="168" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="480" cy="198" r="5.5" fill="#e34948" stroke="#ffffff" stroke-width="2"/>
  <circle cx="670" cy="92" r="5.5" fill="#e34948" stroke="#ffffff" stroke-width="2"/>
  <circle cx="670" cy="136.0" r="5.5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.8"/>
  <line x1="680" y1="168" x2="692" y2="168" stroke="#2a78d6" stroke-width="2.2"/>
  <text x="696" y="172" font-size="12.5" fill="#222222">B low</text>
  <line x1="680" y1="92" x2="692" y2="92" stroke="#e34948" stroke-width="2.2"/>
  <text x="696" y="96" font-size="12.5" fill="#222222">B high</text>
  <text x="682" y="134.0" font-size="12" fill="#5c5c5c">one-at-a-time</text>
  <text x="682" y="149.0" font-size="12" fill="#5c5c5c">prediction</text>
  <text x="400" y="324" font-size="12.5" fill="#5c5c5c">Non-parallel lines: the effect of A depends on the level of B.</text>
</svg>
